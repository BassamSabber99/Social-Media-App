<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo">
        <i class="pi pi-bolt"></i>
      </div>
      <h1>Welcome Back</h1>
      <p>Sign in to continue to your feed</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <i class="pi pi-envelope input-icon"></i>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="Enter your email"
            [class.error]="email?.invalid && email?.touched"
          />
        </div>
        <small class="error-message" *ngIf="email?.invalid && email?.touched">
          <span *ngIf="email?.errors?.['required']">Email is required</span>
          <span *ngIf="email?.errors?.['email']">Invalid email format</span>
        </small>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="pi pi-lock input-icon"></i>
          <input
            id="password"
            [type]="passwordVisible ? 'text' : 'password'"
            formControlName="password"
            placeholder="Enter your password"
            [class.error]="password?.invalid && password?.touched"
          />
          <i
            class="pi input-icon-right"
            [ngClass]="passwordVisible ? 'pi-eye-slash' : 'pi-eye'"
            (click)="togglePasswordVisibility()"
          ></i>
        </div>
        <small class="error-message" *ngIf="password?.invalid && password?.touched">
          <span *ngIf="password?.errors?.['required']">Password is required</span>
          <span *ngIf="password?.errors?.['minlength']">Password must be at least 6 characters</span>
        </small>
      </div>

      <div class="error-alert" *ngIf="error$ | async as error">
        <i class="pi pi-exclamation-circle"></i>
        <span>{{ error }}</span>
      </div>

      <button
        type="submit"
        class="btn-primary"
        [disabled]="(loading$ | async) || loginForm.invalid"
      >
        <span *ngIf="!(loading$ | async)">Sign In</span>
        <span *ngIf="loading$ | async" class="loading-spinner">
          <i class="pi pi-spin pi-spinner"></i> Signing in...
        </span>
      </button>

      <div class="auth-footer">
        <p>Don't have an account? <a routerLink="/auth/register">Sign up</a></p>
      </div>
    </form>
  </div>
</div>
